<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<style>

body {
	background:#333;
    overflow:clip;
}

.grid {
	display:grid;
    width:500px;
    position:absolute;
    top:100px;
    left:calc(50% - 250px);
    z-index:-1;
}

.c1 {
	background:#fff;
    display:inline-block;
}

.c2 {
	background:#ddd;
    display:inline-block;
}

.p {
	background:#00000000;
    border:none;
}

.p:hover {
	background:#aaa;
}

.topbar {
	background:#555;
    padding:10px;
    z-index:1;
}

.navbtn {
	width:30px;
    height:30px;
    border:none;
    background:#777;
    color:#fff;
}

.navbtn:hover {
	background:#aaa;
}

</style>

<nav class="topbar">
	<input type="color" oninput="curCol = this.value" style="width:30px;height:30px;border:none;background:transparent;">
    <button class="navbtn material-symbols-outlined" onclick="newDrawing();">add</button>
    <button class="navbtn material-symbols-outlined" onclick="erasing = false;">create</button>
    <button class="navbtn material-symbols-outlined" onclick="erasing = true;">ink_eraser</button>
    
    <button class="navbtn material-symbols-outlined" onclick="saveImage();">save</button>
</nav>

<div class="grid" id="grid-bg"></div>
<div class="grid" id="grid"></div>

<script>

const grid = document.getElementById("grid");
const gridBg = document.getElementById("grid-bg");

var zoom = 1;
var curCol = "#000000";
var mousedown;
var erasing = false;

window.onmousedown = () => { mousedown = true; };
window.onmouseup = () => { mousedown = false; };

window.onwheel = (e) => { zoom = Math.min(4, Math.max(0.1, zoom + e.wheelDelta / Math.abs(e.wheelDelta) * 0.1)); grid.style.scale = zoom; gridBg.style.scale = zoom; };

var w, h;

function newDrawing() {
	var rows = ""
    while (rows == "") rows = prompt("Enter rows");
    
    var cols = "";
    while (cols == "") cols = prompt("Enter columns");
    
    fillGrid(parseInt(rows), parseInt(cols));
}

function fillGrid(r, c) {
	w = r;
    h = c;
    
    grid.innerHTML = "";
    gridBg.innerHTML = "";

	grid.style.height = r/c*500+"px";
    gridBg.style.height = r/c*500+"px";
    
	grid.style.gridTemplateRows = `repeat(${r}, 1fr)`;
    gridBg.style.gridTemplateRows = `repeat(${r}, 1fr)`;
    
    grid.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    gridBg.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
	
    var idx = 0;
	for (let x = 0; x < r; x++) {
    	for (let y = 0; y < c; y++) {
        	var elem1 = document.createElement("span");
            elem1.className = idx % 2 == 0 ? "c1" : "c2";
            gridBg.appendChild(elem1);
            
            var elem2 = document.createElement("button");
            elem2.className = "p";
            
            elem2.onmousedown = function() { setColor(this); }
            elem2.onmouseover = function() { if (mousedown) setColor(this); }
            
            grid.appendChild(elem2);
            
            idx++;
        }
        if (r % 2 == 0) idx++;
        if (c % 2 != 0) idx++;
    }
}

function setColor(elem) {
	elem.style.background = erasing ? "#00000000" : curCol;
}

function saveImage() {
	var out = new Uint8Array(w*h*32+2);
    
    out[0] = w;
    out[1] = w >> 8;
    out[2] = h;
    out[3] = h >> 8;
    
    var idx = 4;
	for (var i of Array.from(grid.children)) {
        out[idx] = Number(i.style.background) >> 16 & 0xFF;
        out[idx+1] = Number(i.style.background) >> 8 & 0xFF;
        out[idx+2] = Number(i.style.background) & 0xFF;
		out[idx+3] = i.style.background == "#00000000" ? 0 : 255;
		
        idx += 4;
    }
    
    const blob = new Blob([out], { "type": "application/octet-stream" });
    
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "texture.fif";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

fillGrid(16, 16);

</script>
