<input type="file" accept=".bmp" oninput="for (var i of this.files) convert(i);" multiple>
<script>
try {
	function IDX(x, y, xb) { return x + y * xb; }
     
	function convert(file) {
		var fr = new FileReader();

		fr.onload = (e) => {
			const data = new Uint8Array(e.target.result);
			const view = new DataView(e.target.result);
			
			const w = view.getUint32(18, true);
			const h = view.getUint32(22, true);

			const startidx = view.getUint32(10, true);

			var out = new Uint8Array(w*h*4+4);
			out[0] = w & 0xFF;
			out[1] = w >> 8 & 0xFF;
			out[2] = h & 0xFF;
			out[3] = h >> 8 & 0xFF;

			for (let x = 0; x < w; x++) {
            	for (let y = 0; y < h; y++) {
					const idx = 4+IDX(x, h-y-1, w)*4;
                    const didx = IDX()
                }
			}

			var a = document.createElement("a");
			a.href = URL.createObjectURL(new Blob([out], { "type": "application/octet-stream" }));
			a.download = file.name.replace(".bmp", ".fif");
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
		};
        
        fr.readAsArrayBuffer(file);
	}
} catch (e) { alert(e); }
</script>
