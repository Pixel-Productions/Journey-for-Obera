<input type="file" accept=".bmp" oninput="for (var i of this.files) convert(i);" multiple>
<script>
try {
	function convert(file) {
		var fr = new FileReader();

		fr.onload = (e) => {
			const data = new Uint8Array(e.target.result);
			const view = new DataView(e.target.result);
			
			const w = view.getUint32(18, true);
			const h = view.getUint32(22, true);

			const endidx = w*h*4+view.getUint32(10, true)-1;

			var out = new Uint8Array(w*h*4+4);
			out[0] = w & 0xFF;
			out[1] = w >> 8 & 0xFF;
			out[2] = h & 0xFF;
			out[3] = h >> 8 & 0xFF;

			for (let i = 0; i < w*h*4; i += 4) {
				out[i+4] = data[endidx-i-1];
				out[i+5] = data[endidx-i-2];
				out[i+6] = data[endidx-i-3];
				out[i+7] = data[endidx-i];
			}

			var a = document.createElement("a");
			a.href = URL.createObjectURL(new Blob([out], { "type": "application/octet-stream" }));
			a.download = file.name.replace(".bmp", ".fif");
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
		};
        
        fr.readAsArrayBuffer(file);
	}
} catch (e) { alert(e); }
</script>
